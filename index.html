<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="keywords" content="Bootstrap, Landing page, Template, Business, Service">
    <meta name="author" content="Grayrids">
    <title>Slick - Bootstrap 4 Template</title>
    <!--====== Favicon Icon ======-->
    <link rel="shortcut icon" href="img/2.png" type="image/png">
    <!-- Google Fonts for classic & fancy typography -->
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900|Lora:400,400i,700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/LineIcons.css">
    <link rel="stylesheet" href="css/owl.carousel.css">
    <link rel="stylesheet" href="css/owl.theme.css">
    <link rel="stylesheet" href="css/magnific-popup.css">
    <link rel="stylesheet" href="css/nivo-lightbox.css">
    <link rel="stylesheet" href="css/main.css">    
    <link rel="stylesheet" href="css/responsive.css">
    <!-- Custom classic & fancy styles -->
    <style>
      body {
        font-family: 'Lora', serif;
        background: #f9f6f1;
        color: #222;
      }
      h1, h2, h3, h4 {
        font-family: 'Playfair Display', serif;
        letter-spacing: 1px;
        color: #1a1a2e;
      }
      .navbar, footer {
        background: #1a1a2e !important;
      }
      .navbar-brand img {
        filter: grayscale(30%) brightness(1.1) drop-shadow(0 2px 10px #bfa14a50);
      }
      .btn-common, .btn-border-filled {
        background: linear-gradient(90deg, #bfa14a 0%, #f7e7ce 100%);
        color: #222;
        border-radius: 8px;
        border: none;
        transition: background 0.3s, color 0.3s;
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        letter-spacing: 1px;
        box-shadow: 0 4px 16px rgba(191,161,74,0.10);
      }
      .btn-common:hover, .btn-border-filled:hover {
        background: #1a1a2e;
        color: #bfa14a;
        border: 2px solid #bfa14a;
      }
      .section-title {
        color: #bfa14a;
        font-size: 2.5rem;
        position: relative;
        display: inline-block;
      }
      .section-title::after {
        content: '';
        display: block;
        width: 60px;
        height: 4px;
        background: linear-gradient(90deg, #bfa14a, #fff);
        margin: 20px auto 0;
        border-radius: 2px;
      }
      .card, .pricing-table, .single-team, .feature-item, .services-item {
        box-shadow: 0 8px 32px rgba(0,0,0,0.08);
        border-radius: 16px;
        background: #fff;
        margin-bottom: 32px;
      }
      .feature-icon i, .icon i {
        color: #bfa14a;
        font-size: 2.2rem;
      }
      .hero-area {
        background: linear-gradient(135deg, #1a1a2e 0%, #bfa14a 100%);
        color: #fff;
        padding-top: 80px;
        padding-bottom: 80px;
        position: relative;
      }
      .hero-area .head-title {
        font-size: 2.5rem;
        font-family: 'Playfair Display', serif;
        color: #fff;
        margin-bottom: 24px;
      }
      .hero-area .head-title span {
        color: #bfa14a;
      }
      .header-button .btn {
        margin-right: 16px;
      }
      .intro-img img {
        max-width: 85%;
        border-radius: 24px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        border: 4px solid #fff8e3;
      }
      /* Fancy fade-in animation for sections */
      .section-header, .services-item, .feature-item, .pricing-table, .single-team {
        animation: fadeInUp 1s both;
      }
      @keyframes fadeInUp {
        from { opacity:0; transform: translateY(40px);}
        to   { opacity:1; transform: none;}
      }
      /* Gold border for showcase images */
      .screenshot-thumb img {
        border-radius: 16px;
        border: 3px solid #bfa14a50;
        transition: border 0.3s;
      }
      .screenshot-thumb img:hover {
        border: 3px solid #bfa14a;
      }
      .footer {
        background: #1a1a2e;
        color: #fff;
        padding: 40px 0;
        text-align: center;
        font-family: 'Lora', serif;
        letter-spacing: 1px;
        font-size: 1.1rem;
      }
    </style>
  </head>
  
  <body>
    <!-- Header Section Start -->
    <header id="home" class="hero-area">    
      <div class="overlay">
        <span></span>
        <span></span>
      </div>
      <nav class="navbar navbar-expand-md bg-inverse fixed-top scrolling-navbar">
        <div class="container">
          <a href="index.html" class="navbar-brand"><img src="img/logo.png" alt=""></a>       
          <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
            <i class="lni-menu"></i>
          </button>
          <div class="collapse navbar-collapse" id="navbarCollapse">
            <ul class="navbar-nav mr-auto w-100 justify-content-end">
              <li class="nav-item">
                <a class="nav-link page-scroll" href="#home">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link page-scroll" href="#services">About</a>
              </li>  
              <li class="nav-item">
                <a class="nav-link page-scroll" href="#features">Services</a>
              </li>                            
              <li class="nav-item">
                <a class="nav-link page-scroll" href="#showcase">Showcase</a>
              </li>       
              <li class="nav-item">
                <a class="nav-link page-scroll" href="#pricing">Pricing</a>
              </li>     
            </ul>
          </div>
        </div>
      </nav>  
      <div class="container">      
        <div class="row space-100 align-items-center">
          <div class="col-lg-6 col-md-12 col-xs-12">
            <div class="contents">
              <h2 class="head-title">Welcome to <span>Slick</span></h2>
              <p style="font-size:1.25rem;">Experience timeless design, crafted for modern businesses.</p>
              <div class="header-button">
                <a href="https://rebrand.ly/slick-ud" rel="nofollow" target="_blank" class="btn btn-common">Get Started</a>
                <a href="https://rebrand.ly/slick-ud" rel="nofollow" target="_blank" class="btn btn-border-filled">Learn More</a>
              </div>
            </div>
          </div>
          <div class="col-lg-6 col-md-12 col-xs-12 p-0 text-center">
            <div class="intro-img">
              <img src="img/intro.png" alt="">
            </div>            
          </div>
        </div> 
      </div>             
    </header>
    <!-- Header Section End --> 

    <!-- ... rest of your content remains unchanged ... -->

    <!-- Example of a more classic footer -->
    <footer class="footer">
      <div class="container">
        <div>&copy; 2025 Slick. Crafted with <span style="color:#bfa14a;">&#10084;</span> by Grayrids.</div>
      </div>
    </footer>
  </body>
</html>
